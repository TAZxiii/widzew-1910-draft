<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widzew 1910 — interfejs meczu test</title>
<style>
:root{--bg:#090909;--panel:#151515;--panel2:#1d1d1d;--line:#333;--text:#f5f5f5;--muted:#999;--accent:#e30613;--accent2:#ff2432;--good:#58d68d;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#070707,#121212);color:var(--text);font-family:Arial,Helvetica,sans-serif}main{max-width:1050px;margin:0 auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.title{font-size:24px;font-weight:800}.test{font-size:12px;color:#aaa;border:1px solid #444;border-radius:999px;padding:6px 10px}.scoreboard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 35px #0008}.teams{display:grid;grid-template-columns:1fr 150px 1fr;align-items:center;gap:15px}.team{text-align:center;font-weight:800}.team.home{text-align:right}.team.away{text-align:left}.team img{width:66px;height:66px;object-fit:contain;vertical-align:middle;margin:0 10px}.team.home img{float:right}.team.away img{float:left}.team-name{font-size:20px;line-height:66px}.score{text-align:center}.scoreline{font-size:44px;font-weight:900;line-height:1}.minute{font-size:22px;font-weight:800;margin-top:7px}.period{color:var(--muted);font-size:13px;margin-top:4px}.layout{display:grid;grid-template-columns:1fr 310px;gap:14px;margin-top:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.panel h2,.panel h3{margin:0 0 12px}.event{font-size:23px;font-weight:800;line-height:1.35;min-height:82px}.event-meta{color:var(--muted);font-size:13px;margin-top:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.action{background:#242424;border:1px solid #4a4a4a;color:#fff;border-radius:10px;padding:13px;text-align:left;cursor:pointer;transition:.15s}.action:hover:not(:disabled){transform:translateY(-1px);border-color:#888}.action:disabled{opacity:.5;cursor:not-allowed}.action-name{font-weight:800}.action-chance{font-size:13px;color:#bbb;margin-top:6px}.action-chance strong{color:#fff;font-size:16px}.notice{min-height:115px;background:#0d0d0d;border-radius:10px;padding:12px}.notice .empty{color:#777}.feed{max-height:370px;overflow:auto}.feed-row{padding:8px 0;border-bottom:1px solid #252525;font-size:14px}.feed-time{color:#aaa;display:inline-block;width:42px;font-weight:700}.goal{font-weight:900}.controls{display:flex;gap:9px;flex-wrap:wrap}.controls button,.select{background:#eee;color:#111;border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}.controls button.primary{background:var(--accent);color:#fff}.controls button:disabled{opacity:.45;cursor:not-allowed}.settings{display:grid;grid-template-columns:1fr 1fr;gap:9px}.settings label{font-size:12px;color:#aaa}.settings input,.settings select{width:100%;margin-top:5px;padding:8px;border-radius:7px;border:1px solid #555;background:#111;color:#fff}.status{font-size:13px;color:#aaa;min-height:18px}.scorers{margin-top:12px}.scorer{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #292929;font-size:14px}.debug{font-family:Consolas,monospace;font-size:12px;color:#aaa;white-space:pre-wrap;word-break:break-word;background:#080808;padding:10px;border-radius:8px;max-height:220px;overflow:auto}.hidden{display:none}.end{padding:15px;text-align:center;border:1px solid #444;border-radius:10px;background:#0d0d0d;font-weight:900;font-size:20px}@media(max-width:760px){main{padding:10px}.layout{grid-template-columns:1fr}.teams{grid-template-columns:1fr 100px 1fr}.team-name{font-size:15px;line-height:1.2}.team img{float:none!important;width:45px;height:45px;margin:0 auto 5px;display:block}.scoreline{font-size:34px}.actions{grid-template-columns:1fr}.event{font-size:20px}}
</style>
</head>
<body>
<main>
<div class="top"><div class="title">Widzew 1910 — mecz testowy</div><div class="test">STANDALONE / PROTOTYP</div></div>
<section class="scoreboard">
  <div class="teams">
    <div id="homeTeam" class="team home"></div>
    <div class="score"><div id="score" class="scoreline">0 : 0</div><div id="minute" class="minute">—'</div><div id="period" class="period">Mecz nie rozpoczęty</div></div>
    <div id="awayTeam" class="team away"></div>
  </div>
</section>
<div class="layout">
  <section>
    <div class="panel">
      <h2>Aktualna sytuacja</h2>
      <div id="event" class="event">Kliknij „Rozpocznij mecz”, aby rozpocząć.</div>
      <div id="eventMeta" class="event-meta"></div>
      <div id="actions" class="actions"></div>
      <div id="endMessage" class="end hidden"></div>
    </div>
    <div class="panel">
      <h3>Przebieg meczu</h3>
      <div id="feed" class="feed"><div class="feed-row"><span class="empty">Brak zdarzeń.</span></div></div>
    </div>
  </section>
  <aside>
    <div class="panel">
      <h3>Sterowanie</h3>
      <div class="controls">
        <button id="start" class="primary">▶ Rozpocznij mecz</button>
        <button id="newMatch">↻ Nowy mecz</button>
      </div>
      <div id="status" class="status" style="margin-top:10px"></div>
    </div>
    <div class="panel">
      <h3>Test meczu</h3>
      <div class="settings">
        <label>Rywal<select id="opponent"><option value="legia">Legia Warszawa</option></select></label>
        <label>Widzew<select id="venue"><option value="home">Gospodarz</option><option value="away">Gość</option></select></label>
        <label>Overall Widzewa<input id="wOverall" type="number" value="72"></label>
        <label>Overall rywala<input id="oOverall" type="number" value="75"></label>
        <label>Różnica pomocy<input id="mid" type="number" value="10"></label>
        <label>Różnica obrony<input id="def" type="number" value="5"></label>
        <label>Siła trenera<input id="coach" type="number" value="-0.6" step="0.1"></label>
        <label>Charakter rywala<input id="character" type="number" value="7" min="1" max="10"></label>
      </div>
    </div>
    <div class="panel">
      <h3>Strzelcy Widzewa</h3>
      <div id="scorers"><div class="empty">Brak bramek.</div></div>
    </div>
    <div class="panel">
      <h3>Stan techniczny</h3>
      <div id="debug" class="debug">Oczekiwanie na start.</div>
    </div>
  </aside>
</div>
</main>
<script src="./season-match-engine.js?v=12"></script>
<script src="./season-match-engine-6c-extension.js?v=12"></script>
<script src="./season-match-engine-6d-extension.js?v=12"></script>
<script src="./season-match-engine-6e-extension.js?v=12"></script>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id), E=()=>window.WidzewSeasonMatchEngine;
const TEST_PLAYER={name:'Zawodnik testowy',stats:{defensywa:50,szybkosc:50,podania:50,atak:50,zaangazowanie:50,kreatywnosc:50,strzal:50,ogolna:50,graNogami:50,piastkowanie:50,robinsonada:50,br:50}};
const XI=Array.from({length:10},(_,i)=>({...TEST_PLAYER,slot:i+1}));
const TEAM={widzew:{name:'Widzew Łódź',logo:'./data/logos/widzew_lodz.png'},legia:{name:'Legia Warszawa',logo:'./data/logos/legia_warszawa.png'}};
let ACTION_NAMES={},EVENT_NAMES={},COMMUNICATIONS={};
let match=null,state=null,locked=false,currentPlayer=null,currentEvent=null,kState={eventGroup:null,repeatCount:0,k:0};
const MINUTE_BUCKETS=[
 {min:1,max:15,weight:12.70},{min:16,max:30,weight:13.90},{min:31,max:45,weight:15.89},{min:45,max:45,added:5,weight:3.19},
 {min:46,max:60,weight:16.20},{min:61,max:75,weight:15.13},{min:76,max:90,weight:15.89},{min:90,max:90,added:8,weight:7.09}
];
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function weighted(items,r=Math.random){const total=items.reduce((s,x)=>s+x.weight,0);let v=r()*total;for(const x of items){v-=x.weight;if(v<0)return x}return items[items.length-1]}
function randomMinute(r=Math.random){const b=weighted(MINUTE_BUCKETS,r);if(b.added)return b.min+'+'+((Math.floor(r()*b.added)+1));return Math.floor(b.min+r()*(b.max-b.min+1))}
function minuteValue(v){return typeof v==='number'?v:parseFloat(String(v))}
function buildMinutes(n){const arr=[];for(let i=0;i<n;i++)arr.push(randomMinute());return arr.map((m,i)=>({m,order:i})).sort((a,b)=>minuteValue(a.m)-minuteValue(b.m)||a.order-b.order).map(x=>x.m)}
function cfg(){const home=$('venue').value==='home';return{widzew:{overall:+$('wOverall').value||0,players:[]},opponent:{overall:+$('oOverall').value||0,charakter:+$('character').value||5},overallDiff:(+$('wOverall').value||0)-(+$('oOverall').value||0),coachStrength:clamp(+$('coach').value||0,-1,1),home,charakter:+$('character').value||5,midfieldDiff:+$('mid').value||0,defenceDiff:+$('def').value||0,ofShareOverride:undefined}};
function setTeams(){const home=$('venue').value==='home',w=TEAM.widzew,o=TEAM[$('opponent').value];const h=home?w:o,a=home?o:w;$('homeTeam').innerHTML='<img src="'+h.logo+'" alt=""><span class="team-name">'+h.name+'</span>';$('awayTeam').innerHTML='<img src="'+a.logo+'" alt=""><span class="team-name">'+a.name+'</span>'}
function sideForEvent(id){const n=Number(id);return n>=100?'DEF':'OF'}
function firstActionForEvent(id){const n=Number(id);const map={1:'1.1',2:'2.1',3:'3.1',4:'4.1',5:'5.1',6:'6.1',7:'7.1',8:'8.1',101:'101.1',102:'102.1',103:'103.1',104:'104.1',105:'105.1',106:'106.1',107:'107.1',108:'108.1'};return map[n]||null}
function eventZ(id,r=Math.random){const n=Number(id);if([3,7,103,107,10,110].includes(n))return null;const a=firstActionForEvent(n);if(E().chooseZ&&a)return E().chooseZ(n,a,r);return null}
function eventName(ev){const group=sideForEvent(ev.eventId);const item=EVENT_NAMES[group]&&EVENT_NAMES[group][String(ev.eventId)];if(!item)return 'Event '+ev.eventId;let s=item.name;s=s.replace(/Zawodnik XY/g,currentPlayer?currentPlayer.name:'Zawodnik testowy');if(ev.z!==null&&ev.z!==undefined)s=s.replace(/Z m/g,ev.z+' m');else s=s.replace(/ Z m/g,'');return s}
function commName(id){if(!id)return null;const g=String(id).startsWith('99.')?'DEF':String(id).startsWith('9.')?'OF':null;return g&&COMMUNICATIONS[g]&&COMMUNICATIONS[g][String(id)]?COMMUNICATIONS[g][String(id)].name:null}
function addFeed(text,minute,extra){const row=document.createElement('div');row.className='feed-row';if(extra)row.classList.add(extra);row.innerHTML='<span class="feed-time">'+minute+"'"+'</span>'+text;$('feed').prepend(row)}
function renderScore(){const home=$('venue').value==='home';const hs=home?state.score.widzew:state.score.opponent,as=home?state.score.opponent:state.score.widzew;$('score').textContent=hs+' : '+as;$('minute').textContent=state.minute===null?'—':state.minute+"'";$('period').textContent=state.period==='I'?'I połowa':state.period==='II'?'II połowa':'Koniec meczu'}
function renderScorers(){$('scorers').innerHTML=state.scorers.length?state.scorers.map(x=>'<div class="scorer"><span>'+x.player+'</span><b>'+x.minute+"'</b></div>").join(''):'<div class="empty">Brak bramek.</div>'}
function playerForAction(id){const n=String(id),type=(ACTION_NAMES[n]||'').toLowerCase();if(type.includes('podaj')||type.includes('podanie')||type.includes('dośrodkow'))return XI[Math.floor(Math.random()*XI.length)];if(type.includes('drybling')||type.includes('obieg'))return currentPlayer;return currentPlayer}
function renderEvent(){if(!currentEvent)return;$('event').textContent=eventName(currentEvent);$('eventMeta').textContent='Event '+currentEvent.eventId+' · '+currentEvent.side+' · Z = '+(currentEvent.z==null?'—':currentEvent.z)+' · minuta '+state.minute+"'";renderActions()}
function renderActions(){if(!currentEvent){$('actions').innerHTML='';return}const list=E().availableActions(currentEvent.eventId,currentEvent.z)||[];$('actions').innerHTML='';list.forEach(id=>{const b=document.createElement('button');b.className='action';const p=E().calculateActionProbability(String(id),{z:currentEvent.z,performerStats:currentPlayer?currentPlayer.stats:TEST_PLAYER.stats,opponentStats:TEST_PLAYER.stats,k:kState.k});b.innerHTML='<div class="action-name">'+(ACTION_NAMES[String(id)]||'Akcja '+id)+'</div><div class="action-chance">Szansa powodzenia: <strong>'+p.probability.toFixed(1)+'%</strong></div>';b.onclick=()=>playAction(String(id),b,p.probability);$('actions').appendChild(b)})}
function lockActions(){locked=true;document.querySelectorAll('.action').forEach(b=>b.disabled=true)}
function showDebug(obj){$('debug').textContent=JSON.stringify(obj,null,2)}
function nextEventFromTransition(t){if(!t)return null;let id=t.nextEvent;if(!id&&t.nextAction)id=Number(t.nextAction);if(!id)return null;const ev={eventId:Number(id),side:sideForEvent(id),z:t.newZ!==undefined?t.newZ:eventZ(id)};return ev}
function goalFromMessage(id){return id==='9.10'||id==='99.10'}
function applyGoal(id){if(id==='9.10'){state.score.widzew++;state.scorers.push({minute:state.minute,player:currentPlayer?currentPlayer.name:'Zawodnik testowy',team:'widzew'});addFeed('<span class="goal">GOOOL WIDZEWA! — '+(currentPlayer?currentPlayer.name:'Zawodnik testowy')+'</span>',state.minute,'goal')}else if(id==='99.10'){state.score.opponent++;state.scorers.push({minute:state.minute,player:'Przeciwnik',team:'opponent'});addFeed('<span class="goal">GOL PRZECIWNIKA! — Przeciwnik</span>',state.minute,'goal')}renderScore();renderScorers()}
function endSequence(t,messageId){const text=commName(messageId)||messageId||'Koniec sekwencji';if(messageId)addFeed(text,state.minute);if(goalFromMessage(messageId))applyGoal(messageId);currentEvent=null;currentPlayer=null;locked=false;showDebug({sequenceEnded:true,minute:state.minute,messageId:messageId,message:text,transition:t});advanceSequence()}
function advanceSequence(){if(state.sequenceIndex>=state.sequenceEvents.length){finishMatch();return}const item=state.sequenceEvents[state.sequenceIndex++];state.minute=item.minute;if(minuteValue(item.minute)>45&&state.period==='I')state.period='II';if(minuteValue(item.minute)>90){state.period='II'}renderScore();currentEvent={eventId:Number(item.eventId),side:item.side,z:item.z};currentPlayer=XI[Math.floor(Math.random()*XI.length)];kState={eventGroup:null,repeatCount:0,k:0};renderEvent();addFeed('Nowa sekwencja: '+eventName(currentEvent),state.minute);$('status').textContent='Wybierz akcję.'}
function finishMatch(){currentEvent=null;locked=true;$('actions').innerHTML='';$('endMessage').classList.remove('hidden');$('endMessage').textContent='KONIEC MECZU';$('status').textContent='Mecz zakończony.';state.period='END';renderScore();addFeed('Koniec meczu',state.minute);}
function playAction(id,button,displayProbability){if(locked||!currentEvent)return;lockActions();const performer=playerForAction(id);const beforePlayer=currentPlayer;const p=E().resolveAction(id,{z:currentEvent.z,performerStats:performer.stats,opponentStats:TEST_PLAYER.stats,k:kState.k,randomFn:Math.random});kState=E().updateKState(kState,currentEvent.eventId);const t=E().transitionForAction(id,p.success,currentEvent.z,Math.random);const mid=t&&t.message?String(t.message):null;const text=commName(mid)||mid||'Brak komunikatu';if(id==='10'||id==='110'){}addFeed(text,state.minute);if(goalFromMessage(mid)){applyGoal(mid);currentEvent=null;currentPlayer=null;advanceSequence();showDebug({action:id,probability:p.probability,roll:p.roll,success:p.success,transition:t,messageId:mid,message:text,goal:true});return}const next=nextEventFromTransition(t);showDebug({action:id,actionName:ACTION_NAMES[id],probability:p.probability,roll:p.roll,success:p.success,performer:performer.name,startingPlayer:beforePlayer?beforePlayer.name:null,transition:t,messageId:mid,message:text,nextEvent:next});if(next){currentEvent=next;currentPlayer=XI[Math.floor(Math.random()*XI.length)];locked=false;renderEvent();$('status').textContent='Wybierz kolejną akcję.'}else{currentEvent=null;currentPlayer=null;locked=false;advanceSequence()}}
function startMatch(){const eng=E();if(!eng||typeof eng.generateMatch!=='function'){$('status').textContent='Błąd: silnik nie został załadowany.';return}const generated=eng.generateMatch(cfg());const events=Array.isArray(generated.events)?generated.events:[];if(!events.length){$('status').textContent='Błąd: silnik nie wygenerował zdarzeń.';return}const minutes=buildMinutes(events.length);const seq=events.map((ev,i)=>({eventId:Number(ev.eventId),side:ev.side,z:ev.z,minute:minutes[i]})).sort((a,b)=>minuteValue(a.minute)-minuteValue(b.minute));match=generated;state={score:{widzew:0,opponent:0},scorers:[],sequenceEvents:seq,sequenceIndex:0,minute:null,period:'I'};$('feed').innerHTML='';$('endMessage').classList.add('hidden');locked=false;renderScorers();renderScore();addFeed('Mecz rozpoczęty — '+TEAM.widzew.name+' vs '+TEAM[$('opponent').value].name,0);advanceSequence();$('status').textContent='Mecz rozpoczęty.';showDebug({engineVersion:eng.constants&&eng.constants.ENGINE_VERSION||'6A-6B',generatedEvents:events.length,minutes:seq.map(x=>x.minute),venue:$('venue').value,match:generated})}
function reset(){match=null;state=null;currentEvent=null;currentPlayer=null;locked=false;$('event').textContent='Kliknij „Rozpocznij mecz”, aby rozpocząć.';$('eventMeta').textContent='';$('actions').innerHTML='';$('feed').innerHTML='<div class="feed-row"><span class="empty">Brak zdarzeń.</span></div>';$('endMessage').classList.add('hidden');$('status').textContent='';$('scorers').innerHTML='<div class="empty">Brak bramek.</div>';$('score').textContent='0 : 0';$('minute').textContent="—'";$('period').textContent='Mecz nie rozpoczęty';$('debug').textContent='Oczekiwanie na start.'}
function load(){Promise.all([fetch('./data/akcje.json?v=4').then(r=>r.json()),fetch('./data/eventy.json?v=4').then(r=>r.json()),fetch('./data/komunikaty.json?v=4').then(r=>r.json())]).then(([a,e,c])=>{ACTION_NAMES=a;EVENT_NAMES=e;COMMUNICATIONS=c;setTeams();$('status').textContent='Bazy załadowane.'}).catch(err=>{$('status').textContent='Błąd ładowania baz: '+err.message})}
$('start').onclick=startMatch;$('newMatch').onclick=reset;$('venue').onchange=setTeams;$('opponent').onchange=setTeams;setTeams();load();
})();
</script>
</body>
</html>
