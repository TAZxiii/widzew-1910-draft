<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widzew 1910 — tester silnika meczu</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#eee;margin:0;padding:20px}main{max-width:1000px;margin:auto}h1{font-size:24px}.panel{background:#1d1d1d;border:1px solid #444;border-radius:10px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}label{display:flex;flex-direction:column;gap:5px}input,select,button{font-size:16px;padding:9px;border-radius:6px;border:1px solid #666}button{cursor:pointer;font-weight:bold}pre{white-space:pre-wrap;line-height:1.45;background:#080808;padding:14px;border-radius:8px;overflow:auto}.error{color:#ff7777;font-weight:bold}.ok{font-weight:bold}.muted{color:#aaa;font-size:14px}
</style>
</head>
<body><main>
<h1>Widzew 1910 — standalone Match Engine</h1>
<div class="panel"><b>Tester niezależny od głównej gry</b><p class="muted">Ten plik ładuje tylko <code>season-match-engine.js</code>. Nie używa i nie zmienia <code>script.js</code>.</p></div>
<div class="panel grid">
<label>Overall Widzewa<input id="wOverall" type="number" value="72"></label>
<label>Overall rywala<input id="oOverall" type="number" value="75"></label>
<label>Charakter rywala<input id="character" type="number" value="7" min="1" max="10"></label>
<label>Siła trenera<input id="coach" type="number" value="0.6" step="0.1"></label>
<label>Różnica pomocy<input id="mid" type="number" value="0"></label>
<label>Różnica obrony<input id="def" type="number" value="0"></label>
<label>Mecz<select id="home"><option value="1">Dom</option><option value="0">Wyjazd</option></select></label>
</div>
<div class="panel"><button id="one" type="button">GENERUJ TESTOWY MECZ</button> <button id="many" type="button">1000 LOSOWYCH MECZÓW</button></div>
<div class="panel"><div id="summary" class="ok">Silnik: ładowanie…</div><pre id="output">Jeżeli widzisz ten komunikat, tester się uruchomił.</pre></div>
<script src="./season-match-engine.js?v=6"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const summary=$('summary'),output=$('output');
function cfg(){const w=+$('wOverall').value,o=+$('oOverall').value;return{widzew:{overall:w,players:[]},opponent:{overall:o,charakter:+$('character').value},overallDiff:w-o,coachStrength:+$('coach').value,home:$('home').value==='1',charakter:+$('character').value,midfieldDiff:+$('mid').value,defenceDiff:+$('def').value};}
function engine(){return window.WidzewSeasonMatchEngine;}
function run(fn){try{fn();}catch(e){summary.className='error';summary.textContent='BŁĄD: '+(e&&e.message?e.message:e);output.textContent=e&&e.stack?e.stack:String(e);}}
function one(){run(function(){const api=engine();if(!api||typeof api.generateMatch!=='function')throw new Error('Nie załadowano WidzewSeasonMatchEngine.generateMatch. Sprawdź season-match-engine.js.');const x=api.generateMatch(cfg());summary.className='ok';summary.textContent='Silnik '+(x.engineVersion||api.version||'?')+' | Eventów: '+x.totalEvents+' | OF: '+(x.ofShare*100).toFixed(1)+'% | DEF: '+((1-x.ofShare)*100).toFixed(1)+'% | Wynik: '+x.score.widzew+':'+x.score.opponent;output.textContent=(x.events||[]).map(e=>String(e.minute).padStart(3,' ')+'\' | '+e.side+' | event '+e.eventId+' | akcja '+e.actionId+' | Z='+(e.z===null?'—':e.z)+' | K='+e.k).join('\n')||'Brak eventów.';});}
function many(){run(function(){const api=engine();if(!api||typeof api.generateMatch!=='function')throw new Error('Nie załadowano WidzewSeasonMatchEngine.generateMatch.');let total=0,of=0,def=0,w=0,o=0;for(let i=0;i<1000;i++){const x=api.generateMatch(cfg());total+=x.totalEvents;of+=(x.events||[]).filter(e=>e.side==='OF').length;def+=(x.events||[]).filter(e=>e.side==='DEF').length;w+=x.score.widzew;o+=x.score.opponent;}summary.className='ok';summary.textContent='1000 meczów | średnio eventów: '+(total/1000).toFixed(2)+' | OF: '+(100*of/(of+def)).toFixed(2)+'% | DEF: '+(100*def/(of+def)).toFixed(2)+'% | gole: '+w+':'+o;output.textContent='Test 1000 meczów zakończony.';});}
$('one').addEventListener('click',one);$('many').addEventListener('click',many);
window.addEventListener('error',function(e){summary.className='error';summary.textContent='BŁĄD JS: '+e.message;output.textContent='Plik: '+e.filename+'\nLinia: '+e.lineno;});
if(engine()&&typeof engine().generateMatch==='function'){summary.textContent='Silnik '+(engine().version||'?')+' załadowany. Kliknij przycisk.';}
else{summary.className='error';summary.textContent='BŁĄD: silnik nie został załadowany.';}
})();
</script>
</main></body></html>
