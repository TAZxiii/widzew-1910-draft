<!doctype html><html lang='pl'><meta charset='utf-8'><title>Widzew 1910 — tester 6C</title><style>body{font:16px Arial;background:#111;color:#eee;padding:20px;max-width:1000px;margin:auto}button{padding:10px;margin:4px;cursor:pointer}pre{background:#000;padding:15px;white-space:pre-wrap}.box{border:1px solid #555;padding:15px;margin:12px 0}small{color:#aaa}</style><h1>Tester ETAP 6C — matematyka akcji</h1><div class=box><b>Niezależny tester.</b><br><small>Zawodnik testowy i wszystkie statystyki = 50. Ten tester nie dotyka głównej gry.</small></div><div class=box><button id=new>🎲 NOWY EVENT</button><div id=event>—</div><div id=actions></div></div><div class=box><b>Stan K:</b> <span id=k>—</span></div><div class=box><pre id=out>Kliknij NOWY EVENT.</pre></div><script src='./season-match-engine.js?v=11'></script><script src='./season-match-engine-6c-extension.js?v=1'></script><script>(async()=>{const $=x=>document.getElementById(x),E=window.WidzewSeasonMatchEngine;const [A,EV]=await Promise.all([fetch('./data/akcje.json?v=4').then(r=>r.json()),fetch('./data/eventy.json?v=4').then(r=>r.json())]);const stats={defensywa:50,szybkosc:50,podania:50,atak:50,zaangazowanie:50,kreatywnosc:50,strzal:50,ogolna:50,obrona:50,pomoc:50,br:50,graNogami:50,piastkowanie:50,robinsonada:50};let ev=null,kstate=null;function name(e){const g=e.side==='OF'?'OF':'DEF',x=EV[g]?.[String(e.eventId)];return x?x.name.replace(/Zawodnik XY/g,'Zawodnik testowy').replace(/Z m/g,e.z==null?'—':e.z+' m'):'Event '+e.eventId}function next(){const m=E.generateMatch({widzew:{overall:65,players:[]},opponent:{overall:65,charakter:5},home:true});ev=m.events[Math.floor(Math.random()*m.events.length)];kstate=null;$('k').textContent='nowa grupa — pierwsza akcja K=0';$('event').innerHTML='<h2>'+name(ev)+'</h2><small>'+ev.side+' · event '+ev.eventId+' · Z='+(ev.z??'—')+'</small>';$('actions').innerHTML='';E.availableActions(ev.eventId,ev.z).forEach(id=>{let b=document.createElement('button');b.textContent=(A[id]?.name||id)+' ['+id+']';b.onclick=()=>go(id,b);$('actions').appendChild(b)});$('out').textContent='Wybierz akcję.'}function go(id,b){document.querySelectorAll('button').forEach(x=>x.disabled=false);kstate=E.updateKState(kstate,ev.eventId);$('k').textContent='grupa '+kstate.eventGroup+' · iteracja '+kstate.repeatCount+' · K='+kstate.k;const r=E.resolveAction(id,{z:ev.z,k:kstate.k,performerStats:stats,opponentStats:stats});$('out').textContent='AKCJA: '+(A[id]?.name||id)+' ['+id+']

Baza: '+r.base+'
'+r.statTerms.map(t=>t.stat+' = '+t.value+' → '+t.term.toFixed(2)).join('
')+'

Z: '+(r.z??'—')+'
Wpływ Z: '+r.zModifier.toFixed(2)+'
K: '+r.k+'

P = '+r.probability.toFixed(2)+'%
R = '+r.roll.toFixed(2)+'

WYNIK: '+(r.success?'SUKCES':'PORAŻKA')+'

Kliknięcie kolejnej akcji w tym samym evencie zwiększy iterację K.')}$('new').onclick=next;})().catch(e=>$('out').textContent='BŁĄD: '+e.message);</script></html>
